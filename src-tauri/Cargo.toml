[package]
name = "gspaceone-photoid"
version = "0.1.0"
edition = "2021"
description = "High-performance ID photo printing application"

[lib]
name = "gspaceone_photoid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
imageproc = "0.25"
rayon = "1.10"
wgpu = "23"
pollster = "0.4"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
kamadak-exif = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
